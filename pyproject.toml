[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "anomaly-inspection-desktop-app"
version = "0.1.0"
description = "PySide6 desktop app for presence-gated anomaly inspection with Anomalib model support"
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.23",
  "opencv-python>=4.8",
  "PyYAML>=6.0",
]

[project.scripts]
anomaly-inspection = "anomaly_inspection.desktop.main:main"
anomaly-inspection-cli = "anomaly_inspection.cli:main"
# Compatibility aliases for the existing installed commands.
inspection-app = "anomaly_inspection.desktop.main:main"
inspection-cli = "anomaly_inspection.cli:main"

[project.optional-dependencies]
gui = [
  "PySide6>=6.11",
  "QtAwesome>=1.4",
]
anomaly = [
  "anomalib",
  "openvino",
  "torch",
  "lightning",
]
test = [
  "pytest>=7.0",
]
dev = [
  "pytest>=7.0",
]
all = [
  "PySide6>=6.11",
  "QtAwesome>=1.4",
  "anomalib",
  "openvino",
  "torch",
  "lightning",
  "pytest>=7.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
